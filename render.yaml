# Render · service unique « site + API » : un web service Node (server.js + api/) qui
# sert le site, les pages légales ET l'API, devant la base Supabase (voir
# api/supabase/LISEZ-MOI.md). HTTPS fourni et renouvelé par Render.
#
# Déploiement : Render > New > Blueprint > ce dépôt. Render lit ce fichier, crée le
# service, puis demande les valeurs « sync: false » (secrets) à saisir une fois.
services:
  - type: web
    name: douira
    runtime: node
    plan: starter                       # pas de mise en veille (le plan gratuit coupe le service et les paiements en attente)
    buildCommand: "cd api && npm install --omit=dev"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                     # Supabase > Session pooler (…pooler.supabase.com:5432)
      - key: DATABASE_CA
        value: api/supabase/supabase-ca.crt   # certificat racine Supabase (public, versionné) : authentifie le serveur de base (TLS vérifié)
      - key: DATA_KEY
        sync: false                     # générée une fois : node api/cli.js keygen ; à sauvegarder hors de Render
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: PSP
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false                     # clé de TEST (sk_test_) pour la revue Apple ; sk_live_ au vrai lancement
      - key: STRIPE_WEBHOOK_SECRET
        sync: false                     # secret du webhook Stripe pointant sur https://<service>.onrender.com/api/webhooks/stripe
      - key: ANTHROPIC_API_KEY
        sync: false                     # facultatif : assistant des voyageurs ; vide = assistant désactivé proprement
