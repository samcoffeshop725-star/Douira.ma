SPACE.t_dash = () => {
  const u = me(), n = new Date(), in7 = addDays(today(), 7);
  const newReq = S.requests.filter(r => r.status === 'nouvelle');
  const openT = S.tickets.filter(t => ['ouverte', 'en_cours'].includes(t.status));
  const conf = S.bookings.filter(b => b.status === 'confirmed');
  const arrivals = conf.filter(b => parseD(b.start) >= today() && parseD(b.start) <= in7).sort((a, b) => parseD(a.start) - parseD(b.start));
  const last30 = S.bookings.filter(b => b.payment && b.payment.at && new Date(b.payment.at) > addDays(n, -30) && ['confirmed', 'cancelled'].includes(b.status));
  const cash = last30.reduce((s, b) => s + b.q.total - (b.payment.refunded || 0), 0);
  const rev = last30.filter(b => b.status === 'confirmed').reduce((s, b) => s + (b.q.markup || 0) + b.q.serviceFee + b.q.commission, 0);
  const mine = u.role === 'collaborator' ? S.listings.filter(l => l.collaborators.includes(u.id)) : [];
  return `${head('Tableau de bord', `Bonjour ${esc(firstName(u.name))}. Voici ce qui demande votre attention.`)}
    <div class="kpis">${can('requests.manage') ? kpi('Demandes propriétaires', newReq.length, 'nouvelles') : ''}${can('tickets.manage') ? kpi('Demandes clients ouvertes', openT.length, openT.filter(t => t.priority === 'haute').length + ' prioritaires') : ''}
      ${can('bookings.view') ? kpi('Arrivées sous 7 jours', arrivals.length) : ''}${u.role === 'admin' ? kpi('Encaissé sur 30 jours', mad(cash), 'Revenu plateforme : ' + mad(rev)) : ''}</div>
    <div class="two">
      ${can('tickets.manage') ? `<div class="panel"><div class="panel-h"><h3>Réclamations et messages</h3>${btnGo('Tout voir', 'space', { tab: 't_tickets' })}</div>${table(['Réf.', 'Objet', 'Statut'], openT.slice(0, 5).map(t => `<tr class="click" data-act="go" data-to="space" data-tab="t_ticket" data-id="${t.id}"><td class="mono">${esc(t.ref)}</td><td>${esc(t.subject)}${t.priority === 'haute' ? ' <span class="pill bad">Prioritaire</span>' : ''}</td><td>${pill(TICKET_STATUS[t.status])}</td></tr>`), 'Rien en attente.')}</div>` : ''}
      ${can('requests.manage') ? `<div class="panel"><div class="panel-h"><h3>Nouvelles demandes propriétaires</h3>${btnGo('Tout voir', 'space', { tab: 't_requests' })}</div>${table(['Reçue', 'Source', 'Ville'], newReq.slice(0, 5).map(r => `<tr class="click" data-act="reqOpen" data-id="${r.id}"><td>${fmtDT(r.at)}</td><td>${REQ_SOURCE[r.source]}</td><td>${esc(r.name)} · ${esc(r.city)}</td></tr>`), 'Aucune nouvelle demande.')}</div>` : ''}
      ${can('bookings.view') ? `<div class="panel"><div class="panel-h"><h3>Prochaines arrivées</h3>${btnGo('Réservations', 'space', { tab: 't_bookings' })}</div>${table(['Date', 'Réf.', 'Logement'], arrivals.map(b => `<tr class="click" data-act="go" data-to="space" data-tab="t_booking" data-id="${b.id}"><td class="num">${fmtD(b.start)}</td><td class="mono">${esc(b.ref)}</td><td>${esc(listing(b.listingId).title)}</td></tr>`), 'Aucune arrivée dans les 7 jours.')}</div>` : ''}
      ${mine.length ? `<div class="panel"><div class="panel-h"><h3>Annonces dont vous êtes chargé</h3></div>${table(['Annonce', 'Statut'], mine.map(l => `<tr class="click" data-act="go" data-to="space" data-tab="t_listing" data-id="${l.id}"><td>${esc(l.title)}</td><td>${pill(LISTING_STATUS[l.status])}</td></tr>`), '')}</div>` : ''}

};

/* ---------- Versements ---------- */
SPACE.t_payouts = () => {
  const n = new Date(); const list = S.bookings.filter(b => b.payout).sort((a, b) => new Date(a.payout.releaseAt) - new Date(b.payout.releaseAt));
  const due = list.filter(b => b.payout.status === 'programmé' && new Date(b.payout.releaseAt) <= n);
  const sum = arr => arr.reduce((s, b) => s + b.payout.amount, 0);
  return `${head('Versements aux propriétaires', `Règle : versement ${S.settings.payoutDelayHours} h après l'heure d'arrivée, commission déduite.`, `<button class="btn btn-p btn-s" data-act="runPayouts" ${due.length ? '' : 'disabled'}>Exécuter les ${due.length} versement(s) échu(s)</button>`)}
    <div class="kpis">${kpi('Échus à verser', mad(sum(due)), plural(due.length, 'versement'))}${kpi('Programmés', mad(sum(list.filter(b => b.payout.status === 'programmé'))))}${kpi('Versés', mad(sum(list.filter(b => b.payout.status === 'versé'))))}</div>
    <div class="note info small">En production, ce traitement est planifié (tâche quotidienne), exige une double validation au-delà d'un seuil et passe par l'API de virement du prestataire de paiement ou de la banque.</div>
    ${table(['Réf.', 'Propriétaire', 'Logement', 'Échéance', '>Montant', 'Statut'], list.map(b => { const l = listing(b.listingId); return `<tr class="click" data-act="go" data-to="space" data-tab="t_booking" data-id="${b.id}"><td class="mono">${esc(b.ref)}</td><td>${esc(user(l.ownerId).name)}</td><td>${esc(l.title)}</td><td class="num" style="white-space:nowrap">${fmtDT(b.payout.releaseAt)}</td><td class="r">${mad(b.payout.amount)}</td><td>${pill(PAYOUT_STATUS[b.payout.status])}${b.payout.ref ? ' <span class="mono small">' + esc(b.payout.ref) + '</span>' : ''}</td></tr>`; }), 'Aucun versement.')}`;
};

    ${table(['Catégorie', 'Tarification', 'Annonces', 'Visibilité', ''], S.categories.sort((a, b) => a.order - b.order).map(c => { const t = TEMPLATES[c.templateId]; return `<tr><td><b>${esc(c.name)}</b><div class="small muted">Ajoutée le ${fmtDT(c.createdAt)}</div></td><td>${t.units.map(u => 'par ' + UNIT_LABEL[u]).join(', ')}</td><td class="num">${S.listings.filter(l => l.categoryId === c.id).length}</td><td>${pill(c.active ? ['Visible', 'ok'] : ['Masquée', ''])}</td><td><button class="btn ${c.active ? 'btn-g' : 'btn-p'} btn-s" data-act="catToggle" data-id="${c.id}">${c.active ? 'Masquer' : 'Activer'}</button></td></tr>`; }), '')}

  return `<div class="tablewrap"><table class="matrix"><thead><tr><th>Permission</th><th>Administrateur</th><th>Collaborateur</th><th>Propriétaire</th><th>Client</th></tr></thead><tbody>

}

/* =====================================================================
   Avis, notes (5 étoiles) et label Diamond
   ===================================================================== */
const DIAMOND_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11l4 5.5L12 20.5 2.5 9z" fill="currentColor" opacity=".28"/><path d="M6.5 3.5h11l4 5.5L12 20.5 2.5 9zM2.5 9h19M9.5 3.5 8 9l4 11.5L16 9l-1.5-5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const reviewWindow = () => Number(S.settings.reviewWindowDays || 14);

function addReview({ bookingId, kind, rating, comment, authorId, at }) {
  const b = booking(bookingId), l = listing(b.listingId);
  const r = {
    id: uid('rv'), bookingId, listingId: l.id, kind, authorId: authorId || (kind === 'listing' ? b.clientId : l.ownerId),
    targetUserId: kind === 'client' ? b.clientId : l.ownerId, rating: Math.max(1, Math.min(5, Math.round(Number(rating)))),
    comment: comment || '', at: at || nowIso(), hidden: false
  };
  S.reviews.unshift(r); return r;
}
const reviewOf = (bookingId, kind) => S.reviews.find(r => r.bookingId === bookingId && r.kind === kind);
function reviewEligible(b, kind) {
  if (!b || b.status !== 'confirmed') return false;
  const end = checkoutDT(b), n = new Date();
  if (n < end || (n - end) / 864e5 > reviewWindow()) return false;
  return !reviewOf(b.id, kind);
}
function ratingOf(list) { const v = list.filter(r => !r.hidden); return v.length ? { avg: v.reduce((s, r) => s + r.rating, 0) / v.length, count: v.length } : { avg: 0, count: 0 }; }
const listingRating = id => ratingOf(S.reviews.filter(r => r.kind === 'listing' && r.listingId === id));
const clientRating = id => ratingOf(S.reviews.filter(r => r.kind === 'client' && r.targetUserId === id));
const ownerRating = id => ratingOf(S.reviews.filter(r => r.kind === 'listing' && r.targetUserId === id));
const fmtAvg = a => a.toFixed(1).replace('.', ',');
const starsHtml = (avg, size) => `<span class="stars${size ? ' ' + size : ''}" role="img" aria-label="${fmtAvg(avg)} sur 5"><i style="width:${Math.round(avg / 5 * 100)}%"></i></span>`;
const diamondBadge = () => `<span class="dia-badge">${DIAMOND_SVG}Diamond</span>`;
function ratingLine(l) {
  if (l.diamond) return diamondBadge();
  const r = listingRating(l.id);
  return r.count ? `<span class="row" style="gap:6px">${starsHtml(r.avg)} <b class="num">${fmtAvg(r.avg)}</b><span class="muted small">(${plural(r.count, 'avis', 'avis')})</span></span>` : '<span class="small muted">Nouveau sur Douira</span>';
}
function ratingInline(r, empty) { return r.count ? `${starsHtml(r.avg, 'sm')} <span class="small num">${fmtAvg(r.avg)} (${r.count})</span>` : `<span class="small muted">${empty || 'Pas encore noté'}</span>`; }
const clientRatingInline = id => ratingInline(clientRating(id));
function recoScore(l) { const r = listingRating(l.id); return (l.diamond ? 1000 : 0) + r.avg * 10 + Math.min(r.count, 20) * 0.1; }
function diamondBand() {
  return `<div class="dia-band dia-motif">${DIAMOND_SVG.replace('<svg ', '<svg class="big" ')}<div><span class="row" style="gap:8px">${diamondBadge()}<b>Sélection Diamond</b></span><span class="small">Ce bien fait partie des meilleurs logements de ${esc(S.settings.siteName)}. Il a été choisi par notre équipe pour la qualité de l'accueil, des équipements et des retours voyageurs.</span></div></div>`;
}
function diamondSection() {
  const list = publicListings().filter(l => l.diamond);
  if (!list.length) return '';
  return `<section class="sec gutter dia-sec dia-motif"><div class="wrap stack">
    <div class="head"><div class="stack-s" style="gap:4px"><span class="row" style="gap:8px">${diamondBadge()}<span class="eyebrow">Sélection</span></span><h2>Nos biens Diamond</h2><p class="small muted">Les meilleurs appartements et villas, choisis un par un par notre équipe.</p></div>
    <button class="btn btn-g btn-s" data-act="go" data-to="search" data-diamond="1">Voir tous les biens Diamond</button></div>
    <div class="lgrid">${list.map(lcard).join('')}</div></div></section>`;
}
function reviewsSection(l) {
  const list = S.reviews.filter(r => r.kind === 'listing' && r.listingId === l.id && !r.hidden);
  const r = listingRating(l.id);
  return `<div class="stack"><div class="row between"><h3>Avis des voyageurs</h3>${l.diamond ? diamondBadge() : (r.count ? `<span class="row" style="gap:6px">${starsHtml(r.avg, 'lg')} <b class="num" style="font-size:1.1rem">${fmtAvg(r.avg)}</b> <span class="muted">· ${plural(r.count, 'avis', 'avis')}</span></span>` : '')}</div>
    ${list.length ? `<div class="rgrid">${list.slice(0, 6).map(x => `<div class="review"><div class="row" style="gap:8px"><b>${esc(firstName((user(x.authorId) || {}).name || 'Voyageur'))}</b><span class="small muted">${new Date(x.at).toLocaleDateString(LOC(), { month: 'long', year: 'numeric' })}</span>${l.diamond ? '' : starsHtml(x.rating, 'sm')}</div><p>${esc(x.comment)}</p></div>`).join('')}</div>`
      : '<p class="muted small">Pas encore d\'avis. Seuls les voyageurs ayant séjourné peuvent en publier un.</p>'}</div>`;
}
function reviewCard(x, opts = {}) {
  const b = booking(x.bookingId), l = listing(x.listingId), au = user(x.authorId), tg = user(x.targetUserId);
  const what = x.kind === 'listing' ? `Avis sur « ${esc(l.title)} »` : `Avis sur le voyageur ${esc(tg ? tg.name : '—')}`;
  return `<div class="review${x.hidden ? ' hidden' : ''}"><div class="row" style="gap:8px">${starsHtml(x.rating, 'sm')}<b>${what}</b>${x.hidden ? '<span class="pill">Masqué</span>' : ''}</div>
    <span class="small muted">Par ${esc(au ? au.name : '—')} · séjour ${esc(b ? b.ref : '')} · ${fmtDT(x.at)}</span><p>${esc(x.comment)}</p>
    ${opts.moderate ? `<div><button class="btn btn-g btn-s" data-act="reviewToggle" data-id="${x.id}">${x.hidden ? 'Réafficher' : 'Masquer'}</button></div>` : ''}</div>`;
}
function reviewModal(b, kind) {
  const l = listing(b.listingId), c = user(b.clientId);
  const title = kind === 'listing' ? `Votre avis sur « ${l.title} »` : `Noter le voyageur ${c.name}`;
  openModal(`<h2>${esc(title)}</h2>
    <p class="small muted">Séjour ${esc(b.ref)} du ${fmtD(b.start)} au ${fmtD(b.end)}. ${kind === 'client' ? "Cet avis est visible par l'équipe, par les hôtes qui recevront ce voyageur et par le voyageur lui-même. Il n'est pas publié sur le site." : 'Votre avis sera publié sur l\'annonce avec votre prénom.'}</p>
    <form class="stack" data-form="reviewSave" data-id="${b.id}" data-kind="${kind}">
      <fieldset style="border:0;padding:0" class="stack-s"><legend style="padding:0;font-size:.84rem">Note sur 5</legend><div class="rate">${[5, 4, 3, 2, 1].map(n => `<input type="radio" name="rating" id="rt-${n}" value="${n}" required><label for="rt-${n}" aria-label="${plural(n, 'étoile')}" title="${plural(n, 'étoile')}">★</label>`).join('')}</div></fieldset>
      ${field('Commentaire', `<textarea name="comment" id="rv-comment" required minlength="10" maxlength="1000" placeholder="${kind === 'listing' ? "Propreté, emplacement, accueil, conformité à l'annonce…" : 'Respect du logement et du règlement, communication, ponctualité…'}"></textarea>`)}
      <div class="row"><button class="btn btn-p" type="submit">Publier l'avis</button><button type="button" class="btn btn-g" data-act="closeModal">Annuler</button></div></form>`);
}
const reviewBtn = (b, kind, label, cls = 'btn btn-p btn-s') => `<button class="${cls}" data-act="reviewOpen" data-id="${b.id}" data-kind="${kind}">${label}</button>`;

/* ---------- Panneaux dans les fiches existantes ---------- */
function clientReviewPanel(b) {
  const mine = reviewOf(b.id, 'listing'), got = reviewOf(b.id, 'client');
  if (!mine && !got && !reviewEligible(b, 'listing')) return '';
  return `<div class="panel stack"><h3>Avis</h3>
    ${mine ? reviewCard(mine) : reviewEligible(b, 'listing') ? `<p class="small muted">Votre séjour est terminé. Vous avez ${reviewWindow()} jours après le départ pour publier votre avis.</p><div>${reviewBtn(b, 'listing', 'Laisser un avis')}</div>` : ''}
    ${got && !got.hidden ? reviewCard(got) : ''}</div>`;
}
function teamReviewPanel(b) {
  if (b.status !== 'confirmed' || new Date() < checkoutDT(b)) return '';
  const lr = reviewOf(b.id, 'listing'), cr = reviewOf(b.id, 'client'), mod = can('reviews.manage');
  return `<div class="panel stack"><div class="panel-h" style="margin:0"><h3>Avis du séjour</h3>${!cr && mod && reviewEligible(b, 'client') ? reviewBtn(b, 'client', 'Noter le voyageur') : ''}</div>
    ${lr ? reviewCard(lr, { moderate: mod }) : '<p class="small muted">Le voyageur n\'a pas encore donné son avis.</p>'}
    ${cr ? reviewCard(cr, { moderate: mod }) : '<p class="small muted">Le voyageur n\'a pas encore été noté.</p>'}</div>`;
}

/* ---------- Espace client : Mes avis ---------- */
SPACE.c_reviews = () => {

    <div class="two"><div class="panel stack"><h3>Avis que j'ai publiés</h3>${given.map(r => reviewCard(r)).join('') || '<p class="small muted">Aucun avis pour le moment.</p>'}</div>
    <div class="panel stack"><div class="row between"><h3>Avis reçus des hôtes</h3>${gr.count ? `<span>${starsHtml(gr.avg)} <b class="num">${fmtAvg(gr.avg)}</b></span>` : ''}</div>${got.map(r => reviewCard(r)).join('') || '<p class="small muted">Vous n\'avez pas encore été noté.</p>'}</div></div>`;
};

/* ---------- Espace propriétaire : Avis et notes ---------- */
SPACE.o_bookings = () => {

/* ---------- Actions ---------- */
A.reviewOpen = d => {
  const b = booking(d.id), u = me(); if (!b || !u) return;
  const kind = d.kind === 'client' ? 'client' : 'listing';
  const allowed = kind === 'listing' ? b.clientId === u.id : (listing(b.listingId).ownerId === u.id || can('reviews.manage'));
  if (!allowed) return toast('Action non autorisée.', true);
  if (!reviewEligible(b, kind)) return toast(`L'avis n'est possible qu'après le départ, pendant ${reviewWindow()} jours, une seule fois.`, true);
  reviewModal(b, kind);
};
F.reviewSave = (data, form) => {
  const b = booking(form.dataset.id), kind = form.dataset.kind, u = me(); if (!b || !u) return;
  const allowed = kind === 'listing' ? b.clientId === u.id : (listing(b.listingId).ownerId === u.id || can('reviews.manage'));
  if (!allowed || !reviewEligible(b, kind)) return toast('Avis impossible pour ce séjour.', true);
  if (!data.rating) return toast('Choisissez une note de 1 à 5 étoiles.', true);
  if ((data.comment || '').trim().length < 10) return toast('Écrivez un commentaire d\'au moins 10 caractères.', true);
  addReview({ bookingId: b.id, kind, rating: data.rating, comment: data.comment.trim(), authorId: u.id });
  audit(kind === 'listing' ? 'Avis publié sur un bien' : 'Voyageur noté', b.ref);
  closeModal(); toast('Merci, votre avis est publié.'); render();
};
A.reviewToggle = d => {
  if (!guard('reviews.manage')) return; const r = S.reviews.find(x => x.id === d.id);
  r.hidden = !r.hidden; r.moderatedBy = S.session.userId; r.moderatedAt = nowIso();
  audit(r.hidden ? 'Avis masqué' : 'Avis réaffiché', (booking(r.bookingId) || {}).ref || '—'); toast(r.hidden ? 'Avis masqué.' : 'Avis réaffiché.'); render();
};
A.diamondToggle = d => {
  if (!guard('listings.diamond')) return; const l = listing(d.id), r = listingRating(l.id);
  if (l.diamond) return openModal(`<h2>Retirer le label Diamond ?</h2><p>« ${esc(l.title)} » affichera de nouveau sa note en étoiles${r.count ? ` (${fmtAvg(r.avg)} / 5)` : ''}.</p><div class="row"><button class="btn btn-d" data-act="diamondSet" data-id="${l.id}" data-on="0">Retirer</button><button class="btn btn-g" data-act="closeModal">Annuler</button></div>`);
  openModal(`<h2>Passer « ${esc(l.title)} » en Diamond ?</h2>${diamondBand()}
    <dl class="kv"><dt>Note actuelle</dt><dd>${ratingInline(r, 'Aucun avis')}</dd><dt>Statut</dt><dd>${LISTING_STATUS[l.status][0]}</dd></dl>
    <p class="small muted">Sur le site, le label Diamond remplace les étoiles et le bien apparaît en tête des résultats et dans la sélection Diamond de l'accueil. Votre choix est enregistré dans le journal d'audit.</p>
    <div class="row"><button class="btn btn-p" data-act="diamondSet" data-id="${l.id}" data-on="1">Attribuer le label Diamond</button><button class="btn btn-g" data-act="closeModal">Annuler</button></div>`);
};
A.diamondSet = d => {
  if (!guard('listings.diamond')) return; const l = listing(d.id);
  if (d.on === '1') { l.diamond = { at: nowIso(), by: S.session.userId }; audit('Label Diamond attribué', l.title); toast(`« ${l.title} » est maintenant Diamond.`); }
  else { l.diamond = null; audit('Label Diamond retiré', l.title); toast('Label Diamond retiré.'); }

A.searchDiamond = () => go('search', Object.assign({}, R.p, { diamond: R.p.diamond === '1' ? '' : '1' }));
C.diamondRight = el => {
  if (!can('users.manage')) { el.checked = !el.checked; return toast('Action refusée.', true); }

/* =====================================================================
   Localisation (Google Maps, Waze) et favoris / voyages planifiés
   ===================================================================== */
const PIN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" fill="currentColor"/></svg>';
const ROUTE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c4-1 3-6 7-7s4-6 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/></svg>';
const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.8 1.1-1.7 2.7-2.8 4.7-2.8 3.4 0 5.7 3.3 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

const gmapsPlace = g => `https://www.google.com/maps/search/?api=1&query=${g.lat},${g.lng}`;
const gmapsDir = g => `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}`;
const wazeNav = g => `https://waze.com/ul?ll=${g.lat},${g.lng}&navigate=yes`;
const areaQuery = l => `${l.area}, ${l.city}, Maroc`;
const gmapsArea = l => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(areaQuery(l))}`;
const wazeArea = l => `https://waze.com/ul?q=${encodeURIComponent(l.area + ' ' + l.city)}`;
const extLink = (href, icon, label) => `<a class="btn btn-g btn-s" href="${esc(href)}" target="_blank" rel="noopener">${icon}${esc(label)}</a>`;
/* exact = true : position précise du bien. Réservé au client dont le paiement est confirmé, au propriétaire et à l'équipe. */
function mapLinks(l, exact) {
  if (exact && l.geo) return `<div class="row maplinks">${extLink(gmapsPlace(l.geo), PIN_SVG, 'Google Maps')}${extLink(gmapsDir(l.geo), ROUTE_SVG, 'Itinéraire')}${extLink(wazeNav(l.geo), ROUTE_SVG, 'Waze')}</div><span class="small muted mono">${l.geo.lat.toFixed(5)}, ${l.geo.lng.toFixed(5)}</span>`;
  if (exact) return '<span class="small muted">Coordonnées GPS non renseignées.</span>';
  return `<div class="row maplinks">${extLink(gmapsArea(l), PIN_SVG, 'Quartier sur Google Maps')}${extLink(wazeArea(l), ROUTE_SVG, 'Quartier sur Waze')}</div>`;
}
function parseGeo(lat, lng) {
  const a = String(lat ?? '').trim().replace(',', '.'), b = String(lng ?? '').trim().replace(',', '.');
  if (!a && !b) return null;
  const x = Number(a), y = Number(b);
  if (!a || !b || isNaN(x) || isNaN(y) || x < 20 || x > 36.5 || y < -17.5 || y > -0.9) return 'invalid';
  return { lat: x, lng: y };
}
/* Le client voit la position exacte s'il a une réservation payée en cours de validité pour ce bien. */
function clientExactAccess(l) {
  const u = me(); if (!u || u.role !== 'client') return null;
  return S.bookings.find(b => b.listingId === l.id && b.clientId === u.id && accessState(b).ok) || null;
}
function locationSection(l) {
  const own = me() && ((me().role === 'owner' && l.ownerId === me().id) || isTeam());
  const bk = clientExactAccess(l);
  return `<div class="stack-s"><h3>Emplacement</h3>
    <p>${esc(l.area)}, ${esc(l.city)}</p>
    ${bk || own ? `<p class="small">${bk ? `Position exacte de votre logement (réservation ${esc(bk.ref)}) :` : 'Position exacte (visible par vous, pas par les visiteurs) :'}</p>${mapLinks(l, true)}`
      : `${mapLinks(l, false)}<p class="small muted">La position exacte, avec l'itinéraire Google Maps et Waze jusqu'à la porte, est envoyée au voyageur dès la confirmation de son paiement, avec l'adresse et le code d'accès.</p>`}</div>`;
}

const favCount = () => new Set(myLists().flatMap(f => f.items.map(i => i.listingId))).size;
function heartBtn(l) { const on = role() === 'client' && isFav(l.id); return `<button class="heart" data-act="favOpen" data-id="${l.id}" aria-pressed="${on}" aria-label="${on ? 'Modifier mes favoris' : 'Enregistrer dans mes favoris'}" title="${on ? 'Dans vos favoris' : 'Enregistrer'}">${HEART_SVG}</button>`; }
function favInlineBtn(l) { const on = role() === 'client' && isFav(l.id); return `<button class="btn btn-g btn-s favbtn" data-act="favOpen" data-id="${l.id}" aria-pressed="${on}">${HEART_SVG}${on ? 'Dans vos favoris' : 'Enregistrer'}</button>`; }
function favHeaderBtn() { const n = favCount(); return `<button class="btn btn-g btn-s favbtn" data-act="go" data-to="space" data-tab="c_favs" aria-pressed="${n > 0}">${HEART_SVG}Favoris${n ? ` <span class="num">(${n})</span>` : ''}</button>`; }
function favModal(id) {

      ${field(lists.length ? 'Ou créer une nouvelle liste' : 'Nom de votre liste', `<input name="newName" id="fv-new" maxlength="60" placeholder="Ex. Été à Marrakech, Week-end en famille…" value="${lists.length ? '' : 'Mes favoris'}">`)}

}
function newList(name) { const f = { id: uid('fv'), userId: me().id, name: name.slice(0, 60), start: '', end: '', guests: 2, budget: '', notes: '', createdAt: nowIso(), items: [] }; S.favLists.push(f); return f; }

SPACE.c_favs = p => {
  const lists = myLists();
  return `${head('Favoris et voyages', 'Rangez vos logements préférés dans des listes, donnez-leur le nom que vous voulez et préparez vos prochains voyages : dates, nombre de voyageurs, budget, notes.', '<button class="btn btn-p btn-s" data-act="favListNew">Nouvelle liste</button>')}
    ${lists.length ? lists.map(f => favListHtml(f, p.open === f.id)).join('') : `<div class="empty stack-s" style="align-items:center"><p>Vous n'avez pas encore de favoris.</p><p class="small">Touchez le cœur sur un logement pour l'enregistrer.</p>${btnGo('Parcourir les logements', 'search', {}, 'btn btn-p btn-s')}</div>`}`;
};
function favListHtml(f, editing) {
  const planned = f.start && f.end && diffDays(f.start, f.end) > 0;
  const days = planned ? diffDays(isoD(today()), f.start) : null;
  const items = f.items.map(it => ({ it, l: listing(it.listingId) })).filter(x => x.l);
  const rows = items.map(({ it, l }) => {
    const live = l.status === 'published' && (category(l.categoryId) || {}).active;
    let state = '', q = null, avail = false;
    if (!live) state = pill(['Plus disponible', 'bad']);
    else if (planned) {
      q = quote(l, f.start, f.end, Number(f.guests || 1));
      if (parseD(f.start) < today()) state = pill(['Dates passées', '']);
      else if (Number(f.guests) > l.capacity) state = pill([`${l.capacity} voyageurs max.`, 'warn']);
      else if (!isAvailable(l.id, f.start, f.end)) state = pill(['Indisponible à ces dates', 'bad']);
      else { state = pill(['Disponible', 'ok']); avail = true; }
    }
    const ok = live && avail;
    const budget = Number(f.budget || 0);
    return `<div class="item"><img class="thumb" style="width:100%;height:auto;aspect-ratio:4/3" src="${lphoto(l, 0)}" alt="">
      <div class="stack-s" style="gap:3px;min-width:0"><b>${esc(l.title)}</b><span class="small muted">${esc(l.area)}, ${esc(l.city)} · ${esc(category(l.categoryId).name)}</span><span class="small">${ratingLine(l)}</span>
        <span class="row small" style="gap:8px">${state}${q ? `<b class="num">${mad(q.total)}</b> <span class="muted">pour ${plural(q.qty, 'nuit')}</span>${budget ? (q.total <= budget ? ' <span class="pill ok">Dans le budget</span>' : ` <span class="pill warn">+${mad(q.total - budget)} sur le budget</span>`) : ''}` : `<span class="muted">${mad(pubPrice(l))} / ${UNIT_LABEL[tplOf(l).units[0]]}</span>`}</span></div>
      <div class="row acts" style="gap:6px">${live ? (ok ? btnGo('Réserver', 'listing', { id: l.id, start: f.start, end: f.end, guests: f.guests }, 'btn btn-p btn-s') : btnGo('Voir', 'listing', { id: l.id })) : ''}${extLink(gmapsArea(l), PIN_SVG, 'Carte')}<button class="btn btn-g btn-s" data-act="favRemove" data-list="${f.id}" data-id="${l.id}">Retirer</button></div></div>`;
  }).join('');
  const shareTxt = `${f.name}${planned ? ` (du ${fmtD(f.start)} au ${fmtD(f.end)}, ${f.guests} voyageurs)` : ''}\n` + items.map(({ l }) => `• ${l.title} (${l.city}) : ${listingUrl(l)}`).join('\n');
  return `<section class="panel stack favlist">
    <div class="row between"><div class="stack-s" style="gap:2px"><h2 style="font-size:1.4rem">${esc(f.name)}</h2>
      <span class="small muted">${plural(items.length, 'logement')}${planned ? ` · du ${fmtD(f.start)} au ${fmtD(f.end)} · ${plural(Number(f.guests), 'voyageur')}${f.budget ? ' · budget ' + mad(f.budget) : ''}` : ' · voyage pas encore planifié'}</span>
      ${planned && days >= 0 ? `<span class="pill acc" style="align-self:flex-start">${days === 0 ? 'Départ aujourd\'hui' : `Départ dans ${plural(days, 'jour')}`}</span>` : ''}</div>
      <div class="row" style="gap:6px"><button class="btn btn-g btn-s" data-act="favEdit" data-id="${f.id}" aria-expanded="${!!editing}">${planned ? 'Modifier le voyage' : 'Planifier ce voyage'}</button>${items.length ? copyBtn(shareTxt, 'Copier la liste') : ''}<button class="btn btn-d btn-s" data-act="favListDelete" data-id="${f.id}">Supprimer</button></div></div>
    ${editing ? `<form class="fgrid" data-form="favPlan" data-id="${f.id}" style="background:var(--surface-2);padding:14px;border-radius:10px">
      ${field('Nom de la liste', `<input name="name" id="fp-name-${f.id}" required maxlength="60" value="${esc(f.name)}">`, '', 'full')}
      ${field('Arrivée', `<input type="date" name="start" id="fp-s-${f.id}" min="${isoD(today())}" value="${esc(f.start)}">`)}
      ${field('Départ', `<input type="date" name="end" id="fp-e-${f.id}" min="${isoD(addDays(today(), 1))}" value="${esc(f.end)}">`)}
      ${field('Voyageurs', `<input type="number" name="guests" id="fp-g-${f.id}" min="1" max="20" value="${esc(f.guests || 2)}">`)}
      ${field('Budget total (MAD, facultatif)', `<input type="number" name="budget" id="fp-b-${f.id}" min="0" step="100" value="${esc(f.budget)}">`)}
      ${field('Notes de voyage', `<textarea name="notes" id="fp-n-${f.id}" placeholder="Vols, activités, idées de restaurants…">${esc(f.notes)}</textarea>`, '', 'full')}
      <div class="row full"><button class="btn btn-p btn-s" type="submit">Enregistrer</button><button type="button" class="btn btn-g btn-s" data-act="favEdit" data-id="${f.id}">Fermer</button></div></form>` : (f.notes ? `<p class="small" style="white-space:pre-line">${esc(f.notes)}</p>` : '')}
    ${planned ? '<p class="small muted">Disponibilités et prix calculés pour vos dates. Rien n\'est bloqué tant que vous n\'avez pas réservé et payé.</p>' : ''}
    ${rows || '<p class="small muted">Cette liste est vide. Touchez le cœur sur un logement pour l\'y ajouter.</p>'}</section>`;
}

/* ---------- Actions ---------- */
A.favOpen = d => {
  const u = me();
  if (!u) { pendingFav = d.id; return openModal(bookAuthModal().replace('Connectez-vous pour réserver', 'Connectez-vous pour enregistrer vos favoris').replace('Créer mon compte et continuer', 'Créer mon compte')); }
  if (u.role !== 'client') return toast('Les favoris sont réservés aux comptes clients.', true);
  favModal(d.id);
};
F.favSave = (data, form) => {
  const u = me(); if (!u || u.role !== 'client') return;
  const id = form.dataset.id, fd = new FormData(form), chosen = fd.getAll('lists');
  myLists().forEach(f => {
    const has = f.items.some(i => i.listingId === id);
    if (chosen.includes(f.id) && !has) f.items.push({ listingId: id, addedAt: nowIso() });
    if (!chosen.includes(f.id) && has) f.items = f.items.filter(i => i.listingId !== id);
  });
  const name = (data.newName || '').trim();
  if (name) newList(name).items.push({ listingId: id, addedAt: nowIso() });

function approxGeo(l) { const g = l.geo || (CITY_GEO[l.city] ? { lat: CITY_GEO[l.city][0], lng: CITY_GEO[l.city][1] } : null); return g ? { lat: Math.round(g.lat * 50) / 50, lng: Math.round(g.lng * 50) / 50 } : null; }

  if (p.city) list = list.filter(l => l.city === p.city);
  if (p.area) list = list.filter(l => l.area === p.area);
  if (p.promo === '1') list = list.filter(l => discountOf(l));
  if (p.diamond === '1') list = list.filter(l => l.diamond);
  const g = Number(p.guests || 1); list = list.filter(l => l.capacity >= g);
  if (p.max) list = list.filter(l => pubPrice(l) <= Number(p.max));
  let note = '';
  if (p.start && p.end) { if (diffDays(p.start, p.end) < 1) note = '<div class="note bad">La date de départ doit suivre la date d\'arrivée.</div>'; else list = list.filter(l => isAvailable(l.id, p.start, p.end)); }
  const sort = p.sort || 'reco', pr = l => pubPrice(l);
  if (sort === 'reco') { if (!p.q) list.sort((a, b) => recoScore(b) - recoScore(a) || pr(a) - pr(b)); }
  else if (sort === 'rating') list.sort((a, b) => (b.diamond ? 6 : listingRating(b.id).avg) - (a.diamond ? 6 : listingRating(a.id).avg));
  else list.sort((a, b) => sort === 'price_desc' ? pr(b) - pr(a) : pr(a) - pr(b));
  const cats = activeCats(), cities = [...new Set(publicListings().map(l => l.city))].sort();

  const view = p.view === 'map' ? 'map' : 'list';
  const nf = [p.q ? '« ' + p.q + ' »' : '', p.area, p.cat && category(p.cat) ? category(p.cat).name : '', p.start && p.end ? fmtD(p.start) + ' → ' + fmtD(p.end) : '', (p.guests || 2) + ' voy.', p.max ? '≤ ' + mad(p.max) : ''].filter(Boolean).join(' · ');

      ${cats.length > 1 ? field('Type', `<select name="cat" id="sb-cat">${opt('', 'Tous', p.cat)}${cats.map(c => opt(c.id, c.name, p.cat)).join('')}</select>`) : ''}
      ${field('Arrivée', `<input type="date" name="start" id="sb-start" value="${esc(p.start || '')}" min="${isoD(today())}">`)}
      ${field('Départ', `<input type="date" name="end" id="sb-end" value="${esc(p.end || '')}" min="${isoD(addDays(today(), 1))}">`)}
      ${field('Voyageurs', `<input type="number" name="guests" id="sb-guests" min="1" max="20" value="${esc(p.guests || 2)}">`)}
      ${field('Prix max. / nuit', `<input type="number" name="max" id="sb-max" min="0" step="50" placeholder="Sans limite" value="${esc(p.max || '')}">`)}
      <button class="btn btn-p" type="submit">Rechercher</button></form></details></div>
    <div class="sbody${view === 'map' ? ' show-map' : ''}">
      <div class="slist gutter">
        <nav class="crumbs small" aria-label="Fil d'Ariane"><button data-act="go" data-to="home">Accueil</button><span>/</span><span>${esc(p.area || p.city || (openCities().length === 1 ? openCities()[0] : 'Maroc'))}</span></nav>

          <label class="row small" for="sort">Trier <select id="sort" style="width:auto" data-chg="sort">${opt('reco', 'Recommandés', sort)}${opt('rating', 'Mieux notés', sort)}${opt('price', 'Prix croissant', sort)}${opt('price_desc', 'Prix décroissant', sort)}</select></label></div></div>

VIEWS.listing = p => {

  const tpl = tplOf(l), a = l.attrs || {}, cat = category(l.categoryId), owner = user(l.ownerId) || {};
  const preview = !(l.status === 'published' && cat.active);
  const start = p.start || isoD(addDays(today(), 14)), end = p.end || isoD(addDays(today(), 17));
  const cl = cleaner(l.cleanerId), hr = ownerRating(l.ownerId);
  const extra = tpl.fields.filter(f => !['bedrooms', 'bathrooms', 'surface'].includes(f.k) && a[f.k] !== undefined && a[f.k] !== '').map(f => `<span class="fact">${esc(f.label)} : ${esc(a[f.k])}</span>`).join('');
  const similar = publicListings().filter(x => x.id !== l.id && (x.city === l.city || x.categoryId === l.categoryId)).sort((x, y) => (y.city === l.city) - (x.city === l.city) || recoScore(y) - recoScore(x)).slice(0, 3);

/* ---------- Photos : stockées dans le navigateur pour la démo (IndexedDB) ----------
   En production : stockage objet (S3 ou équivalent) avec redimensionnement côté serveur. */
const PhotoDB = {
  db: null, cache: {},
  init() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('douira-photos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('p');
        r.onerror = () => res(0);
        r.onsuccess = () => {
          this.db = r.result;
          try {
            const req = this.db.transaction('p').objectStore('p').openCursor(); let n = 0;
            req.onsuccess = () => { const c = req.result; if (c) { this.cache[c.key] = c.value; n++; c.continue(); } else res(n); };
            req.onerror = () => res(0);
          } catch (e) { res(0); }
        };
      } catch (e) { res(0); }
    });
  },
  put(id, data) { this.cache[id] = data; try { this.db && this.db.transaction('p', 'readwrite').objectStore('p').put(data, id); } catch (e) { /* mémoire seulement */ } },
  del(id) { delete this.cache[id]; try { this.db && this.db.transaction('p', 'readwrite').objectStore('p').delete(id); } catch (e) { /* ignoré */ } }
};
const realPhotos = l => (l.photoUrls && l.photoUrls.length) ? l.photoUrls : (l.photos || []).filter(id => PhotoDB.cache[id]);
function lphoto(l, i = 0) { if (l.photoUrls && l.photoUrls.length) return l.photoUrls[i % l.photoUrls.length]; const ph = realPhotos(l); return ph.length ? PhotoDB.cache[ph[i % ph.length]] : art(l.art + i, i % 3); }
async function fileToJpeg(file, max = 1600) {
  const url = URL.createObjectURL(file); const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', 0.82);
}

function refundSchedule(b) {
  const l = listing(b.listingId), q = b.q, ci = checkinDT(b), ex = addOnsTotal(q);
  const at = h => new Date(ci.getTime() - h * 36e5);
  const rows = [];
  const line = (until, pct) => rows.push({ until, pct, amount: Math.round(q.base * pct / 100) + q.tax + ex });
  if (l.policy === 'flexible') { line(at(24), 100); line(ci, 0); }
  else if (l.policy === 'moderee') { line(at(120), 100); line(ci, 50); }
  else { line(at(168), 50); line(ci, 0); }
  return rows.filter(r => r.until > new Date() || r === rows[rows.length - 1]);
}

   tuiles OpenStreetMap, ou d'un fournisseur choisi dans config.js.
   Aucune bibliothèque externe : tuiles de 256 px, déplacement à la souris
   ou au doigt, zoom (boutons, molette, double-clic, pincement).
   Confidentialité : les épingles publiques restent à la position arrondie
   (≈ 2 km) avec un zoom limité ; la fiche d'un logement montre un secteur,
   jamais un point. Seule l'équipe voit et place la position exacte.

   Vidéos des logements et visionneuse photos/vidéos de la fiche.
   - Démo : les vidéos importées dans l'éditeur d'annonce sont gardées dans
     ce navigateur (IndexedDB), comme les photos.
   - Site en ligne (vitrine) : fichiers déposés dans le dossier « videos »

const VideoDB = {
  db: null, cache: {},

    return new Promise(res => {
      try {
        const r = indexedDB.open('douira-videos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('v');
        r.onerror = () => res(0);

          this.db = r.result;

            req.onsuccess = () => { const c = req.result; if (c) { this.mem(c.key, c.value); n++; c.continue(); } else res(n); };

  mem(id, rec) { try { this.cache[id] = { url: URL.createObjectURL(rec.blob), poster: rec.poster || '', name: rec.name || '', duration: rec.duration || 0 }; } catch (e) { /* illisible */ } },

function packMatches(q) {
  const toks = qTokens(q); if (!toks.length) return [];
  return publicPacks().map(pk => {
    const l = listing(pk.listingId);
    const hay = qTokens([pk.title, pk.titleEn, pk.description, pk.descriptionEn, l.title, l.titleEn, l.area, 'pack forfait formule package bundle',
      ...(pk.extras || []).map(e => (extra(e.extraId) || {}).name), ...(pk.services || []).map(s => { const v = svcById(s.serviceId) || {}; return `${v.name || ''} ${v.nameEn || ''}`; })].filter(Boolean).join(' '));
    const sc = toks.filter(t => hay.some(h => h === t || (t.length > 3 && h.startsWith(t)))).length;
    return { pk, sc };
  }).filter(x => x.sc && x.sc >= Math.min(toks.length, 2)).sort((a, b) => b.sc - a.sc).map(x => x.pk);
}

function packsWithService(words) {

}

/* ---------- QR code (version 1 à 5, niveau L, octets) ---------- */
function qrSvg(text) {
  const bytes = [...new TextEncoder().encode(text)];

  const bits = []; const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4); push(bytes.length, 8); bytes.forEach(b => push(b, 8)); push(0, Math.min(4, DCW[v] * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
  for (let k = 0; data.length < DCW[v]; k++) data.push(k % 2 ? 0x11 : 0xEC);
  // Reed-Solomon
  const EXP = new Array(512), LOG = new Array(256); let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  let gen = [1]; for (let i = 0; i < ECW[v]; i++) { const ng = new Array(gen.length + 1).fill(0); for (let j = 0; j < gen.length; j++) { ng[j] ^= gen[j]; ng[j + 1] ^= EXP[(LOG[gen[j]] + i) % 255]; } gen = ng; }
  const ec = new Array(ECW[v]).fill(0); const msg = data.concat(ec);
  for (let i = 0; i < data.length; i++) { const c = msg[i]; if (!c) continue; for (let j = 1; j < gen.length; j++) msg[i + j] ^= EXP[(LOG[gen[j]] + LOG[c]) % 255]; }
  const all = data.concat(msg.slice(data.length));
  // Matrice
  const M = Array.from({ length: n }, () => new Array(n).fill(null));
  const set = (r, c, val) => { if (r >= 0 && r < n && c >= 0 && c < n) M[r][c] = val; };
  const finder = (r, c) => { for (let i = -1; i <= 7; i++) for (let j = -1; j <= 7; j++) { const on = i >= 0 && i <= 6 && j >= 0 && j <= 6 && (i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4)); set(r + i, c + j, on ? 1 : 0); } };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  if (ALIGN[v]) { const a = ALIGN[v]; for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) set(a + i, a + j, (Math.abs(i) === 2 || Math.abs(j) === 2 || (i === 0 && j === 0)) ? 1 : 0); }
  for (let i = 8; i < n - 8; i++) { set(6, i, i % 2 === 0 ? 1 : 0); set(i, 6, i % 2 === 0 ? 1 : 0); }
  set(n - 8, 8, 1);
  // Zones de format (réservées puis remplies)
  const FMT = 0x77C4, fb = i => (FMT >> i) & 1; // niveau L, masque 0 (bit 0 = poids faible), set(ligne, colonne)
  for (let i = 0; i <= 5; i++) set(i, 8, fb(i));
  set(7, 8, fb(6)); set(8, 8, fb(7)); set(8, 7, fb(8));
  for (let i = 9; i < 15; i++) set(8, 14 - i, fb(i));
  for (let i = 0; i < 8; i++) set(8, n - 1 - i, fb(i));
  for (let i = 8; i < 15; i++) set(n - 15 + i, 8, fb(i));
  // Placement en zigzag, masque 0
  let bi = 0, up = true;
  for (let c = n - 1; c > 0; c -= 2) {
    if (c === 6) c--;
    for (let k = 0; k < n; k++) { const r = up ? n - 1 - k : k; for (const cc of [c, c - 1]) { if (M[r][cc] !== null) continue; const byte = all[bi >> 3], bit = byte === undefined ? 0 : (byte >> (7 - (bi & 7))) & 1; bi++; M[r][cc] = bit ^ ((r + cc) % 2 === 0 ? 1 : 0); } }
    up = !up;
  }
  let path = ''; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (M[r][c]) path += `M${c + 4} ${r + 4}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 8} ${n + 8}" role="img" aria-label="Code QR de votre séjour" shape-rendering="crispEdges"><rect width="${n + 8}" height="${n + 8}" fill="#fff"/><path d="${path}" fill="#111"/></svg>`;
}

/* ---------- 4. Taux de change : ExchangeRate-API, point d'accès ouvert ----------
   Source : https://open.er-api.com/v6/latest/EUR (sans clé, mise à jour quotidienne, limité par adresse IP :
   en cas d'excès, réponse 429 pendant 20 minutes). Le site interroge l'API au plus une fois par heure et
   par navigateur (cache local), et garde le dernier taux connu ; sinon il revient au taux manuel réglé
   par l'administrateur. L'attribution « Rates By Exchange Rate API » est affichée dans le pied de page. */
const FX = { url: 'https://open.er-api.com/v6/latest/EUR', key: 'douira-fx', ttl: 36e5, data: null, status: 'idle' };
function fxLoad() {
  try { const c = JSON.parse(localStorage.getItem(FX.key) || 'null'); if (c && c.rates) FX.data = c; } catch (e) { /* stockage indisponible */ }
}
function fxApply() {
  const d = FX.data; if (!d || !d.rates || !(d.rates.MAD > 0)) return;
  if (S.settings.eurAuto === false) return;
  const r = Math.round(d.rates.MAD * 100) / 100;
  if (S.settings.eurRate !== r || S.settings.eurRateDate !== d.date) { S.settings.eurRate = r; S.settings.eurRateDate = d.date; S.settings.eurRateSource = 'api'; save(); }
}
async function fxRefresh() {
  if (FX.status === 'loading' || (FX.data && Date.now() - (FX.data.fetchedAt || 0) < FX.ttl)) return;
  FX.status = 'loading';
  try {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null; if (ctl) setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(FX.url, { signal: ctl ? ctl.signal : undefined, cache: 'no-store' });
    if (res.status === 429) throw new Error('quota');
    const j = await res.json(); if (j.result !== 'success' || !j.rates) throw new Error('réponse invalide');
    FX.data = { rates: { MAD: j.rates.MAD, USD: j.rates.USD, GBP: j.rates.GBP }, date: new Date((j.time_last_update_unix || Date.now() / 1000) * 1000).toISOString().slice(0, 10), fetchedAt: Date.now() };
    try { localStorage.setItem(FX.key, JSON.stringify(FX.data)); } catch (e) { /* ignoré */ }
    FX.status = 'ok'; fxApply(); renderFoot();
  } catch (e) { FX.status = e.message === 'quota' ? 'quota' : 'error'; /* le dernier taux connu ou le taux manuel reste affiché */ }
}

if (IS_VITRINE) { const _vs = vitrineState; vitrineState = function () { _vs(); if (VCFG && VCFG.tauxEuroAuto === false) S.settings.eurAuto = false; }; }
const _renderFootFx = renderFoot;
renderFoot = function () {
  _renderFootFx();
  const lb = document.querySelector('#foot .legalbar'); if (!lb) return;
  const d = FX.data, auto = S.settings.eurAuto !== false && d && d.rates && d.rates.MAD;
  const fmt = (code, v) => `1 ${code} ≈ ${(d.rates.MAD / v).toFixed(2).replace('.', isEN() ? '.' : ',')} MAD`;
  lb.insertAdjacentHTML('beforeend', `<span class="fx-note">${auto ? `${fmt('€', 1)}${d.rates.USD ? ' · ' + fmt('$', d.rates.USD) : ''}${d.rates.GBP ? ' · ' + fmt('£', d.rates.GBP) : ''} · ${isEN() ? 'rate of' : 'taux du'} ${fmtD(d.date)} · <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>` : (FX.status === 'quota' || FX.status === 'error' ? (isEN() ? 'Live rates unavailable: indicative rate kept.' : 'Taux en direct indisponible : taux indicatif conservé.') : '')}</span>`);
};
// Réglage administrateur : taux automatique ou manuel
const _settingsSaveFx = F.settingsSave;
F.settingsSave = (data, form) => {
  if (data.eurAuto !== undefined || form.querySelector('#st-eur-auto')) S.settings.eurAuto = !!data.eurAuto;
  // Un taux saisi à la main (ou 0 pour masquer les euros) prime : la mise à jour automatique s'arrête, sinon elle l'écraserait aussitôt

  const typed = data.eurRate !== undefined && data.eurRate !== '' ? Math.round(Number(data.eurRate) * 100) / 100 : NaN;
  const manual = S.settings.eurAuto !== false && typed >= 0 && typed < 100 && typed !== S.settings.eurRate;

  if (manual) { S.settings.eurRateSource = 'manual'; save(); toast('Taux saisi à la main : la mise à jour automatique est désactivée.'); render(); }

/* =====================================================================
   Recherche : barre dans l'en-tête avec suggestions pendant la frappe,
   et mot-clé « q » sur la page Logements. Le même moteur sert à l'assistant.
   Insensible aux accents et aux majuscules ; comprend « pour 6 personnes »,
   « moins de 1500 MAD », « villa », « appartement » et les noms de quartier.
   Ne cherche que dans les informations publiques des annonces.
   ===================================================================== */
const qNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const Q_STOP = new Set('de des du la le les un une au aux et en pour avec dans sur pres proche je j cherche cherchons veux voudrais aimerais trouver trouve mon ma mes l d qui que quoi est il y a ou par vous nous on me moi un une ce cette ces se sa son ses the a an of with for in to is are i want looking please svp merci bonjour logement logements location louer mad dh dirham dirhams nuit nuits par do does can how what when where which who my your we it there be get and or at from am was will would could have has any some this that need under below moins max maximum hello'.split(' '));
const Q_SYN = { appart: 'appartement', apparts: 'appartement', appartements: 'appartement', studios: 'studio', villas: 'villa', maison: 'villa', maisons: 'villa', house: 'villa', apartment: 'appartement', flat: 'appartement', clim: 'climatisation', climatise: 'climatisation', internet: 'wi-fi', wifi: 'wi-fi', piscines: 'piscine', pool: 'piscine', swimming: 'piscine', garage: 'parking', jardins: 'jardin', garden: 'jardin', terrasses: 'terrasse', rooftop: 'terrasse', golf: 'golfs', medina: 'medina', riads: 'riad', promo: 'remise', promotion: 'remise', offre: 'remise', offres: 'remise', reduction: 'remise', diamant: 'diamond', film: 'video', videos: 'video', quiet: 'calme', family: 'famille', kids: 'enfant', children: 'enfant', mountains: 'atlas', mountain: 'atlas', station: 'gare' };
const qStem = t => (Q_SYN[t] || (t.length > 4 && t.endsWith('s') && !t.endsWith('ss') ? t.slice(0, -1) : t));
function qTokens(s) { return qNorm(s).replace(/[^a-z0-9\-\s]/g, ' ').split(/\s+/).map(qStem).filter(t => t.length > 1 && !Q_STOP.has(t)); }

// Lit une demande en langage courant : texte libre + filtres reconnus

    const ci = commonOf(pub.map(l => l.checkIn)) || '15:00', co = commonOf(pub.map(l => l.checkOut)) || '11:00';
    return { text: T(`Les horaires sont indiqués sur chaque fiche. Le plus souvent : arrivée à partir de ${ci} et départ avant ${co}.`, `Times are shown on each listing. Usually: check-in from ${ci} and check-out before ${co}.`) };
  }
  // Packs complets (logement + véhicule + services, un seul paiement)
  const pks = publicPacks(), pkLine = p => { const f = packFrom(p); return `- ${pkLabel(p)}${f ? T(` : dès ${mad(f.total)} (${plural(f.nights, 'nuit')}, ${plural(f.guests, 'voyageur')})`, `: from ${mad(f.total)} (${nEN(f.nights, 'night', 'nights')}, ${nEN(f.guests, 'guest', 'guests')})`) : ''}`; };
  const pkActs = list => assistActs([...list.slice(0, 3).map(p => actGo(pkLabel(p), 'pack', { id: p.id })), list.length > 1 ? actGo(T('Tous les packs', 'All packages'), 'packs') : '']);
  if (pks.length && has(n, [' pack ', ' packs ', 'forfait', 'tout compris', 'tout inclus', ' package', ' bundle', 'all inclusive', 'all-inclusive'])) {
    return { text: T('Nos packs complets réunissent le logement, un véhicule et des services, réservés et payés en une seule fois :', 'Our complete packages combine the accommodation, a vehicle and services, booked and paid for in one go:') + '\n\n' + pks.slice(0, 3).map(pkLine).join('\n'), extra: pkActs(pks) };
  }
  if (has(n, ['voiture', ' moto', 'scooter', 'vehicule', ' quad ', 'buggy', 'conduire', 'rent a car', 'car rental', 'hire a car', 'motorbike', 'motorcycle', 'vehicle', ' drive'])) {
    const xs = S.extras.filter(x => x.active);
    if (!xs.length) return { text: T("Nous ne proposons pas encore de véhicules en ligne. Écrivez-nous : l'équipe vous indiquera les solutions possibles.", "We don't offer vehicles online yet. Write to us and the team will suggest options."), extra: assistActs(contactActs(q)) };
    return { text: en ? `You can add a vehicle to your stay, delivered to your accommodation:\n${xs.map(x => `- ${x.name}: ${mad(x.pricePerDay)} per day`).join('\n')}\n\n${IS_VITRINE ? 'Mention it in your booking request.' : 'Add it when you book, subject to availability.'}`
      : `Vous pouvez ajouter un véhicule à votre séjour, livré au logement :\n${xs.map(x => `- ${x.name} : ${mad(x.pricePerDay)} par jour`).join('\n')}\n\n${IS_VITRINE ? 'Indiquez-le dans votre demande de réservation.' : 'Ajoutez-le au moment de la réservation, selon les disponibilités.'}`,
      extra: assistActs([actGo(T('Voir les voitures et motos', 'See cars and motorbikes'), 'services')]) };
  }
  if (has(n, ['aeroport', 'navette', 'transfert', ' taxi', 'airport', 'shuttle', 'transfer', 'pick up', 'pickup'])) {
    const tp = packsWithService(['transfert', 'aeroport', 'transfer', 'airport']);
    if (tp.length) return { text: T(`Le transfert depuis l'aéroport est inclus dans ${tp.length > 1 ? 'ces packs' : 'ce pack'}, avec le logement :`, `An airport transfer is included in ${tp.length > 1 ? 'these packages' : 'this package'}, together with the accommodation:`) + '\n\n' + tp.slice(0, 3).map(pkLine).join('\n'), extra: pkActs(tp) };
  }
  // Services proposés dans les packs (repas, courses, excursions…)
  const svcWords = ['chef', 'cuisiniere', ' cook ', 'courses avant', 'groceries', 'massage', 'excursion', 'day trip', 'agafay', ' desert', 'montgolfiere', 'balloon', 'beach club', 'fitness', 'salle de sport', ' gym', 'padel', 'quad', 'club enfants'].filter(w => n.includes(w));
  const sp = svcWords.length ? packsWithService(svcWords) : [];
  if (sp.length) return { text: T(`C'est proposé dans ${sp.length > 1 ? 'nos packs complets' : 'notre pack complet'}, avec le logement et réservé en une seule fois :`, `This is offered in our complete ${sp.length > 1 ? 'packages' : 'package'}, together with the accommodation and booked in one go:`) + '\n\n' + sp.slice(0, 3).map(pkLine).join('\n'), extra: pkActs(sp) };
  // Service proposé hors pack : sur demande, avec la page des services et le contact
  const unitTxt = u => T(SERVICE_UNITS[u] || '', { sejour: 'per stay', personne: 'per guest', nuit: 'per night' }[u] || '');
  const sr = svcWords.length ? showServices().filter(v => { const h = qNorm(`${v.name} ${v.nameEn || ''} ${v.desc || ''} ${v.descEn || ''}`); return svcWords.some(w => h.includes(qNorm(w).trim())); }) : [];
  if (sr.length) return { text: T('Nous proposons ce service sur demande :', 'We offer this service on request:') + '\n\n' + sr.slice(0, 3).map(v => `- ${svcLabel(v)}${T(' : ', ': ')}${mad(v.price)} ${unitTxt(v.unit)}`).join('\n'), extra: assistActs([actGo(T('Voir nos services', 'See our services'), 'services'), ...contactActs(q)]) };
  if (has(n, ['aeroport', 'navette', 'transfert', ' taxi', 'airport', 'shuttle', 'transfer', 'pick up', 'pickup'])) return { text: T("Le transfert depuis l'aéroport ne fait pas partie des options réservables en ligne. Écrivez-nous : l'équipe vous indiquera les solutions possibles.", "Airport transfers can't be booked online. Write to us and the team will suggest options."), extra: assistActs(contactActs(q)) };
  if (has(n, ['diamond', ' label'])) return { text: T('Le label Diamond distingue les biens sélectionnés un par un par notre équipe pour leur qualité.', 'The Diamond label marks properties hand-picked one by one by our team for their quality.'), extra: assistActs([actGo(T('Voir les biens Diamond', 'See Diamond properties'), 'search', { diamond: '1' })]) };
  if (has(n, ['proprietaire', 'mon bien', 'mon appartement', 'ma villa', 'louer mon', 'mettre en location', 'confier', ' owner', 'my property', 'my apartment', 'my villa', 'my flat', 'list my', 'rent out', 'manage my'])) return { text: T(`Vous êtes propriétaire à ${openCities()[0]} ? Décrivez votre bien dans le formulaire « Proposer mon bien » : un membre de l'équipe vous recontacte, visite le bien et crée l'annonce avec vous.`, `Are you an owner in ${openCities()[0]}? Describe your property in the “List my property” form: a team member will get back to you, visit the property and create the listing with you.`), extra: assistActs([actGo(T('Proposer mon bien', 'List my property'), 'propose')]) };
  if (has(n, ['reclamation', 'probleme', 'plainte', 'urgence', ' panne', ' fuite', ' bruit', 'pas content', 'souci', 'complaint', 'problem', ' issue', 'emergency', 'broken', ' leak', ' noise', 'not happy'])) return { text: T('Désolé pour ce souci. Notre équipe peut vous aider rapidement :', "Sorry about that. Our team can help you quickly:"), extra: assistActs(contactActs(q)) };
  if (has(n, ['contact', 'joindre', 'whatsapp', 'telephone', 'appeler', ' email', ' mail', 'humain', 'conseiller', ' agent ', 'parler a', ' equipe ', ' phone', ' call', ' human', 'speak to', 'talk to', ' team'])) {
    return { text: T('Notre équipe vous répond', 'Our team will reply') + (st.contactEmail ? T(` (e-mail : ${st.contactEmail})`, ` (email: ${st.contactEmail})`) : '') + T(' :', ':'), extra: assistActs(contactActs(q)) };
  }
  if (has(n, ['animal', 'animaux', ' chien', ' chat ', 'fumeur', ' fumer', ' fete', 'soiree', ' bebe', ' enfant', ' pet ', ' pets', ' dog', ' cat ', ' smok', ' party', ' parties', ' baby', ' child', ' kids'])) {
    if (cur && cur.rules) return { text: T(`Règlement de « ${cur.title} » : ${cur.rules}\nPour un cas particulier, demandez-nous avant de réserver.`, `House rules for “${ct}”: ${trx(cur.rules)}\nFor a special case, ask us before booking.`), extra: assistActs(contactActs(about(cur, q))) };

  const pq = pq0;

  // Recherche de logement
  const wants = pq.cat || pq.area || pq.guests || pq.max || has(n, ['piscine', 'jardin', 'terrasse', ' villa', 'appartement', ' studio', 'logement', 'chambre', ' dispo', 'trouver', 'cherche', ' louer', ' sejour', ' nuit', ' vue', ' calme', 'famille', 'parking', 'riad', 'pas cher', 'budget', 'diamond', 'remise',
    ' pool', 'garden', 'terrace', 'apartment', ' flat', ' stay', 'bedroom', 'available', ' find', 'looking for', ' rent', ' night', ' view', ' quiet', 'family', 'cheap', 'discount', ' deal', ' offer']);
  if (wants) {

    const params = Object.assign({}, pq.cat ? { cat: pq.cat } : {}, pq.area ? { area: pq.area } : {}, pq.guests ? { guests: String(pq.guests) } : {}, pq.max ? { max: String(pq.max) } : {}, pq.text.length ? { q: pq.text.join(' ') } : {});
    if (ls.length) return { text: en ? `${ls.length > 1 ? `I found ${ls.length} stays` : 'I found one stay'}${crit ? ' (' + crit + ')' : ''}.${ls.length > 3 ? ' Here are the most relevant:' : ''} Choose your dates on the listing page to see availability and the total price.`
      : `${ls.length > 1 ? `J'ai trouvé ${ls.length} logements` : "J'ai trouvé un logement"}${crit ? ' (' + crit + ')' : ''}.${ls.length > 3 ? ' Voici les plus pertinents :' : ''} Choisissez vos dates sur la fiche pour voir la disponibilité et le prix total.`,

  }
  if (fq) return { text: fq.a };
  return { text: T("Je n'ai pas de réponse sûre à cette question. Notre équipe peut vous répondre :", "I don't have a reliable answer to that question. Our team can help:"), extra: assistActs(contactActs(q)),

/* =====================================================================
   Version anglaise (visiteurs et clients) et équivalent des prix en euros.
   - La langue vient du choix du visiteur (mémorisé), du lien (?lang=en) ou
     de la langue du navigateur (français et arabe -> français, sinon anglais).
   - Les pages sont produites en français, puis traduites avant affichage :
     dictionnaire EN (build/en.json), règles pour les textes variables
     (nombres, dates, noms), contenus anglais des annonces (titleEn…).
   - Les espaces équipe et propriétaire restent en français.
   ===================================================================== */
// « var » et « function » : utilisables par les formats de date et de prix (b_core.js) avant ce fichier
var I18N = { lang: 'fr', orig: new WeakMap(), set: new WeakMap(), attrOrig: new WeakMap(), attrSet: new WeakMap(), dyn: new Map(), mo: null };
const LANG_KEY = 'douira-lang';
I18N.lang = (() => {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'fr') return q; } catch (e) { /* ignoré */ }
  try { const s = localStorage.getItem(LANG_KEY); if (s === 'en' || s === 'fr') return s; } catch (e) { /* ignoré */ }
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'fr';
  return /^(fr|ar)/i.test(nav) ? 'fr' : 'en';
})();
function i18nOn() { return typeof S !== 'undefined' && !!S && !!S.session && !isTeam() && role() !== 'owner'; }
function isEN() { return !!I18N && I18N.lang === 'en' && i18nOn(); }
function T(fr, en) { return isEN() ? en : fr; }

/* ---------- Euros (indicatif) ---------- */
const EUR_DEFAULT = { rate: 10.94, date: '2026-10-19' };
const eurRate = () => { const r = Number(S.settings.eurRate); return r > 0 ? r : (S.settings.eurRate === 0 ? 0 : EUR_DEFAULT.rate); };
const eurDate = () => S.settings.eurRateDate || EUR_DEFAULT.date;
const eurFmt = m => { const r = eurRate(); if (!r || !(m > 0)) return ''; return new Intl.NumberFormat(LOC(), { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(Math.round(m / r)); };
const eurTitle = () => T(`Montant indicatif en euros (1 € ≈ ${String(eurRate()).replace('.', ',')} MAD, taux du ${fmtD(eurDate())}). Le paiement se fait en dirhams.`, `Approximate amount in euros (€1 ≈ ${eurRate()} MAD, rate of ${fmtD(eurDate())}). Payment is made in dirhams.`);
const eurHtml = (m, cls = 'eur') => { const e = eurFmt(m); return e ? `<span class="${cls}" title="${esc(eurTitle())}" translate="no">≈ ${e}</span>` : ''; };
const lPrice = l => { const u = tplOf(l).units[0], p = pubPrice(l, u), d = discountOf(l); return d ? Math.round(p * (100 - d.pct) / 100) : p; };

/* ---------- Contenus en anglais ---------- */
// Titre d'une annonce dans la langue affichée (cartes de l'assistant, messages préparés)
const ltitle = l => (isEN() && l) ? (l.titleEn || EN[l.title] || l.title) : (l ? l.title : '');
function buildDyn() {
  const m = I18N.dyn; m.clear();
  const put = (fr, en) => { if (fr && en && typeof fr === 'string' && typeof en === 'string') m.set(fr.replace(/\s+/g, ' ').trim(), en); };
  (S.listings || []).forEach(l => { put(l.title, l.titleEn); put(l.description, l.descriptionEn); put(l.rules, l.rulesEn); if (l.discount) put(l.discount.label, l.discount.labelEn); });
  const c = S.content || {};
  put(c.heroTitle, c.heroTitleEn); put(c.heroText, c.heroTextEn); put(c.ownerPitch, c.ownerPitchEn);
  (c.faq || []).forEach((f, i) => { const e = (c.faqEn || [])[i]; if (e) { put(f.q, e.q); put(f.a, e.a); } });
  (S.extras || []).forEach(x => put(x.specs, x.specsEn));
  (S.categories || []).forEach(x => put(x.name, x.nameEn));
  (S.packs || []).forEach(p => { put(p.title, p.titleEn); put(p.description, p.descriptionEn); });
  (S.services || []).forEach(x => { put(x.name, x.nameEn); put(x.desc, x.descEn); });
}

  [/^Photo : (.+) ·$/, (m, n) => `Photo: ${n} ·`],
  [/^Photo (\d+) sur (\d+)$/, (m, a, b) => `Photo ${a} of ${b}`],
  [/^Photo (\d+)$/, (m, a) => `Photo ${a}`],
  [/^Vidéo (\d+)$/, (m, a) => `Video ${a}`],
  [/^Photos et vidéos : (.+)$/, (m, t) => `Photos and videos: ${sub(t)}`],
  [/^Assistant (.+)$/, (m, s) => `${s} assistant`],
  [/^Quartier à (.+)$/, (m, c) => `Neighbourhood in ${c}`],
  [/^quartiers de (.+)$/, (m, c) => `neighbourhoods in ${c}`],
  [/^(.+), quartier par quartier$/, (m, c) => `${c}, neighbourhood by neighbourhood`],
  [/^, séjour à (.+) ·$/, (m, c) => `, stay in ${c} ·`],
  [/^Appartements et villas vérifiés à (.+), réservés en ligne et accompagnés par une équipe locale\.$/, (m, c) => `Verified apartments and villas in ${c}, booked online and supported by a local team.`],
  [/^Appartements et villas à (.+)$/, (m, c) => `Apartments and villas in ${c}`],
  [/^Ce bien fait partie des meilleurs logements de (.+)\. Il a été choisi par notre équipe pour la qualité de l'accueil, des équipements et des retours voyageurs\.$/, (m, s) => `This property is one of the best stays on ${s}. Our team chose it for the quality of its welcome, its amenities and guest feedback.`],
  [/^Aucun frais bancaire ajouté par (.+)\. Votre banque peut appliquer des frais de change sur une carte étrangère\.$/, (m, s) => `No bank fees added by ${s}. Your bank may charge currency conversion fees on a foreign card.`],
  [/^Paiement par carte sur la page sécurisée de notre prestataire : (.+) n'enregistre jamais votre numéro de carte\.$/, (m, s) => `Card payment on our provider's secure page: ${s} never stores your card number.`],
  [/^E-mails reçus de (.+)$/, (m, s) => `Emails received from ${s}`],
  [/^Vous êtes propriétaire à (.+) \? Confiez-nous votre bien\.$/, (m, c) => `Are you an owner in ${c}? Entrust us with your property.`],
  [/^Votre séjour est terminé\. Vous avez (\d+) jours après le départ pour publier votre avis\.$/, (m, n) => `Your stay is over. You have ${n} days after check-out to post your review.`],
  [/^L'avis n'est possible qu'après le départ, pendant (\d+) jours, une seule fois\.$/, (m, n) => `A review can only be posted once, within ${n} days after check-out.`],
  [/^Ce logement accueille (.+) au maximum\.$/, (m, p) => `This stay sleeps ${sub(p)} at most.`],
  [/^Liste « (.+) » créée\.$/, (m, n) => `List “${n}” created.`],
  [/^« (.+) » n'est plus disponible à ces dates\.$/, (m, t) => `“${sub(t)}” is no longer available on these dates.`],
  [/^Réservation annulée, (.+) remboursés\.$/, (m, a) => `Booking cancelled, ${a} refunded.`],
  [/^Réservation annulée\. Remboursement : (.+)\.$/, (m, a) => `Booking cancelled. Refund: ${a}.`],
  [/^Connecté : (.+)$/, (m, n) => `Signed in: ${n}`],
  [/^Confirmation renvoyée à (.+)$/, (m, e) => `Confirmation resent to ${e}`],
  [/^([^·]+), (\d[\d,.\s]* MAD)$/, (m, t, p) => { const x = trCore(t); return x == null ? null : `${x}, ${p}`; }],
  [/^([^·()]+) \(([^()]+)\)$/, (m, t, rest) => { const x = trCore(t); return x == null ? null : `${x} (${sub(rest)})`; }],
  [/^· ([^·]+)$/, (m, x) => { const t = trCore(x); return t == null ? null : '· ' + t; }],
  [/^([^·]+) ·$/, (m, x) => { const t = trCore(x); return t == null ? null : t + ' ·'; }]

function trCore(s) {
  const core = String(s).replace(/\s+/g, ' ').trim();
  if (!core) return null;
  if (!/[A-Za-zÀ-ÿ]/.test(core)) {
    // Nombres seuls écrits à la française : note « 4,7 » → 4.7, remise « −20 % » → −20%
    const t = core.replace(/^(\d+),(\d)(?!\d)/, '$1.$2').replace(/(\d) %/g, '$1%');
    return t !== core ? t : null;
  }
  // Textes anglais saisis pour le site (annonces, config.js) d'abord, puis le dictionnaire
  let t = I18N.dyn.get(core); if (t !== undefined) return t;
  t = EN[core]; if (t !== undefined) return t;
  for (const [re, fn] of EN_RULES) { const m = core.match(re); if (m) { const r = fn(...m); if (r != null && r !== core) return r; } }
  if (core.includes(' · ')) { const parts = core.split(' · '), tp = parts.map(sub); if (tp.some((x, i) => x !== parts[i])) return tp.join(' · '); }
  return null;
}
// Garde les espaces autour du texte (ex. « Arrivée à partir de  » suivi d'une heure en gras)
function trText(v) { const t = trCore(v); if (t == null) return null; const m = /^(\s*)[\s\S]*?(\s*)$/.exec(v); return m[1] + t + m[2]; }

/* ---------- Traduction de la page ---------- */
const I18N_ATTRS = ['placeholder', 'aria-label', 'title', 'alt', 'data-q'];
const i18nSkip = el => !el || !!el.closest('#demobar, [translate="no"], script, style, pre, code, textarea[data-user]');
function trTextNode(n) {
  const p = n.parentElement; if (!p || i18nSkip(p)) return;
  const v = n.nodeValue; if (I18N.set.get(n) === v) return;
  const t = trText(v); if (t == null || t === v) return;
  I18N.orig.set(n, v); I18N.set.set(n, t); n.nodeValue = t;
}
function trAttr(el, a) {
  const v = el.getAttribute(a); if (!v) return;
  const done = I18N.attrSet.get(el); if (done && done[a] === v) return;
  const t = trCore(v); if (t == null || t === v) return;
  const o = I18N.attrOrig.get(el) || {}; o[a] = v; I18N.attrOrig.set(el, o);
  const d = done || {}; d[a] = t; I18N.attrSet.set(el, d);
  el.setAttribute(a, t);
}
function trTree(root) {
  if (!root) return;
  if (root.nodeType === 3) return trTextNode(root);
  if (root.nodeType !== 1 || i18nSkip(root)) return;
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = tw.nextNode())) trTextNode(n);
  [root, ...root.querySelectorAll('[placeholder],[aria-label],[title],[alt],[data-q]')].forEach(el => { if (!i18nSkip(el)) I18N_ATTRS.forEach(a => { if (el.hasAttribute && el.hasAttribute(a)) trAttr(el, a); }); });
}
function restoreFrench() {
  const tw = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n;
  while ((n = tw.nextNode())) { if (I18N.orig.has(n) && I18N.set.get(n) === n.nodeValue) n.nodeValue = I18N.orig.get(n); I18N.orig.delete(n); I18N.set.delete(n); }
  document.querySelectorAll('[placeholder],[aria-label],[title],[alt],[data-q]').forEach(el => { const o = I18N.attrOrig.get(el), d = I18N.attrSet.get(el) || {}; if (o) Object.entries(o).forEach(([a, v]) => { if (el.getAttribute(a) === d[a]) el.setAttribute(a, v); }); I18N.attrOrig.delete(el); I18N.attrSet.delete(el); });
}
function i18nWatch() {
  if (I18N.mo || typeof MutationObserver === 'undefined') return;
  I18N.mo = new MutationObserver(muts => {
    if (!isEN()) return;
    muts.forEach(m => { if (m.type === 'childList') m.addedNodes.forEach(trTree); else if (m.type === 'characterData') trTextNode(m.target); else if (m.type === 'attributes' && m.target.nodeType === 1 && !i18nSkip(m.target)) trAttr(m.target, m.attributeName); });
  });
  I18N.mo.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: I18N_ATTRS });
}

/* ---------- Bouton de langue (en-tête, menu sur téléphone, pied de page) ---------- */
const langBtn = cls => isEN()
  ? `<button type="button" class="${cls}" data-act="langSet" data-lang="fr" lang="fr" translate="no" aria-label="Version française du site">${cls === 'lang-btn' ? 'FR' : 'Français'}</button>`
  : `<button type="button" class="${cls}" data-act="langSet" data-lang="en" lang="en" translate="no" aria-label="English version of the site">${cls === 'lang-btn' ? 'EN' : 'English'}</button>`;
const _renderTopI18n = renderTop;
renderTop = function () {
  _renderTopI18n();
  if (!i18nOn()) return;
  const t = $('#topbar'), form = $('#qs-form'), extra = t && t.querySelector('.nav-extra');
  if (form) form.insertAdjacentHTML('afterend', langBtn('lang-btn'));
  if (extra) extra.insertAdjacentHTML('afterbegin', langBtn('lang-item'));
  if (typeof qsFit === 'function') qsFit();
};
const _renderFootI18n = renderFoot;
renderFoot = function () {
  _renderFootI18n();
  const lb = document.querySelector('#foot .legalbar'); if (!lb) return;
  const r = eurRate();
  lb.insertAdjacentHTML('beforeend', `${r ? `<span class="eur-note">${esc(T(`Prix en euros indicatifs : 1 € ≈ ${String(r).replace('.', ',')} MAD (taux du ${fmtD(eurDate())}). Paiement en dirhams.`, `Prices in euros are approximate: €1 ≈ ${r} MAD (rate of ${fmtD(eurDate())}). Payment in dirhams.`))}</span>` : ''}${i18nOn() ? `<span class="lang-foot">${langBtn('lang-link')}</span>` : ''}`);
};
// Si le bouton de langue fait passer l'en-tête sur deux lignes, il s'efface (la langue reste au pied de page et dans le menu)
const _qsFitI18n = qsFit;
qsFit = function () {
  const t = $('#topbar'); if (t) t.classList.remove('lang-hide');
  _qsFitI18n();
  if (!t || window.innerWidth <= 760 || !t.querySelector('.lang-btn')) return;
  const br = t.querySelector('.brand'); if (!br) return;
  const wraps = () => { const mid = br.offsetTop + br.offsetHeight / 2; return [...br.parentNode.children].some(c => c.id !== 'qs-form' && c.offsetParent && Math.abs(c.offsetTop + c.offsetHeight / 2 - mid) > 8); };
  if (!wraps()) return;
  const tight0 = t.classList.contains('qs-tight');
  t.classList.add('lang-hide'); if (!wraps()) return;
  t.classList.add('qs-tight'); if (!wraps()) return;
  t.classList.remove('lang-hide'); t.classList.toggle('qs-tight', tight0);
};
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => qsFit()).catch(() => {});
A.langSet = d => setLang(d.lang);
function setLang(l) {
  if (l !== 'en' && l !== 'fr') return;
  I18N.lang = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignoré */ }
  if (l === 'fr') restoreFrench();
  if (typeof ASSIST !== 'undefined' && ASSIST.msgs.length <= 1) { ASSIST.msgs = []; if (ASSIST.open) { ASSIST.msgs.push(assistGreeting()); assistDraw(); } }
  render();
  if (typeof assistSetMode === 'function' && typeof ASSIST !== 'undefined' && ASSIST.mode) assistSetMode(ASSIST.mode);
}

/* ---------- Après chaque affichage : traduction, langue du document, titre ---------- */
const _renderI18n = render;
render = function () {
  _renderI18n();
  const en = isEN();
  document.documentElement.lang = en ? 'en' : 'fr';
  if (!en) return;
  buildDyn(); i18nWatch();
  // Textes juridiques : publiés en français, la version française fait foi
  if (R.name === 'legal') { const h = document.querySelector('#app .prose h1'); if (h && !document.querySelector('#app .legal-en')) h.insertAdjacentHTML('afterend', '<p class="note info small legal-en" translate="no">This legal document is published in French. The French version prevails.</p>'); }
  trTree(document.body);
  document.title = sub(document.title);
  if (typeof qsFit === 'function') qsFit();
};


/* =====================================================================
   Mode clair / sombre : choix du visiteur (bouton dans l'en-tête et le menu
   mobile, sélecteur Automatique / Clair / Sombre au pied de page), mémorisé
   dans le navigateur ('douira-theme'). « Automatique » suit le réglage de
   l'appareil (prefers-color-scheme). Les couleurs des deux modes sont dans
   z_theme.css (:root[data-theme="dark"] / "light") ; ce module ne fait que
   poser l'attribut, la couleur de la barre du navigateur et le color-scheme.
   Préférence d'affichage personnelle : indépendante de la marque du site
   choisie par l'administrateur (data-brand).
   ===================================================================== */
const THEME = { key: 'douira-theme', colors: { light: '#A8432A', dark: '#17141A' } };
function themePref() { try { const v = localStorage.getItem(THEME.key); return v === 'dark' || v === 'light' ? v : 'auto'; } catch (e) { return 'auto'; } }
const themeSystem = () => (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
const themeActive = () => { const p = themePref(); return p === 'auto' ? themeSystem() : p; };
function applyTheme() {
  const p = themePref(), a = themeActive(), root = document.documentElement;
  if (p === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', p);
  root.style.colorScheme = a; // formulaires, barres de défilement et images système dans le bon ton
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', THEME.colors[a]);
}
function setTheme(v) {
  try { if (v === 'auto') localStorage.removeItem(THEME.key); else localStorage.setItem(THEME.key, v); } catch (e) { /* stockage indisponible : le choix vaut pour la page */ }
  applyTheme(); render();
}
A.themeToggle = () => setTheme(themeActive() === 'dark' ? 'light' : 'dark');
C.themeSel = el => setTheme(el.value);
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (themePref() === 'auto') { applyTheme(); render(); } }); } catch (e) { /* anciens navigateurs */ } }

const THEME_ICON = {
  sun: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  moon: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>'
};
// Bouton : montre le mode vers lequel on bascule, libellé lisible par les lecteurs d'écran
function themeBtn(cls) {
  const dark = themeActive() === 'dark';
  const label = dark ? 'Passer en mode clair' : 'Passer en mode sombre';
  return `<button type="button" class="${cls}" data-act="themeToggle" aria-label="${label}" title="${label}" aria-pressed="${dark}">${dark ? THEME_ICON.sun : THEME_ICON.moon}${cls === 'theme-item' ? `<span>${dark ? 'Mode clair' : 'Mode sombre'}</span>` : ''}</button>`;
}
const _renderTopTheme = renderTop;
renderTop = function () {
  _renderTopTheme();
  const t = $('#topbar'); if (!t) return;
  const anchor = t.querySelector('.lang-btn') || t.querySelector('#qs-form'); if (anchor) anchor.insertAdjacentHTML('afterend', themeBtn('theme-btn'));
  const extra = t.querySelector('.nav-extra'); if (extra) extra.insertAdjacentHTML('afterbegin', themeBtn('theme-item'));
  if (typeof qsFit === 'function') qsFit();
};
const _renderFootTheme = renderFoot;
renderFoot = function () {
  _renderFootTheme();
  const lb = document.querySelector('#foot .legalbar'); if (!lb) return;
  const p = themePref();
  lb.insertAdjacentHTML('beforeend', `<label class="theme-sel"><span>Thème</span><select data-chg="themeSel" aria-label="Thème d'affichage">${[['auto', 'Automatique'], ['light', 'Clair'], ['dark', 'Sombre']].map(([v, l]) => `<option value="${v}"${p === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>`);
};
// Le bouton ne doit pas coûter de place au champ de recherche : si l'en-tête doit se resserrer, il s'efface
// (le choix reste dans le menu mobile et au pied de page) et l'ajustement est recalculé sans lui.
if (typeof qsFit === 'function') {
  const _qsFitTheme = qsFit;
  qsFit = function () {
    const t = $('#topbar'); if (t) t.classList.remove('theme-hide');
    _qsFitTheme();
    if (!t || window.innerWidth <= 760 || !t.querySelector('.theme-btn')) return;
    if (t.classList.contains('qs-compact') || t.classList.contains('qs-tight') || t.classList.contains('lang-hide')) { t.classList.add('theme-hide'); _qsFitTheme(); }
  };
}
applyTheme();

load();
vitrineChecks();
demoNoIndex();
try { const [n, p] = parseHash(location.hash); R.name = n; R.p = p; } catch (e) { /* adresse illisible : accueil */ }
render();
setHistory(true);
PhotoDB.init().then(n => { if (n) render(); });

</script>
